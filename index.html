:root { --bg: #f2f2f2; --ink: #1d1d1d; --mark: #00aeef; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

  font-family: "Selawik", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;

h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4.5rem); font-weight: 700; letter-spacing: -0.02em; text-align: center; }

.zs-ink { fill: #231f20; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .zs-ink { fill: #fff; } }
:root[data-theme="dark"] .zs-ink { fill: #fff; }
h1::after { content: ""; display: block; width: 56px; height: 4px; margin: 20px auto 0; border-radius: 2px; background: var(--mark); }
