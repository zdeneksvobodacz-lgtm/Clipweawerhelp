<style>
@font-face { font-family: "Selawik"; src: url("clipweaverhelp/fonts/selawk.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Selawik"; src: url("clipweaverhelp/fonts/selawksb.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Selawik"; src: url("clipweaverhelp/fonts/selawkb.woff2") format("woff2"); font-weight: 700 900; font-style: normal; font-display: swap; }
:root { --bg: #f2f2f2; --ink: #1d1d1d; --mark: #00aeef; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1a1a1a; --ink: #e8e8e8; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1a1a1a; --ink: #e8e8e8; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--ink);
  font-family: "Selawik", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
}
h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4.5rem); font-weight: 700; letter-spacing: -0.02em; text-align: center; }
.zs-logo { position: fixed; top: max(16px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: clamp(40px, 6vw, 56px); height: auto; display: block; border-radius: 9%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .zs-logo { box-shadow: 0 0 0 1px #4a4a4a; } }
:root[data-theme="dark"] .zs-logo { box-shadow: 0 0 0 1px #4a4a4a; }
h1::after { content: ""; display: block; width: 56px; height: 4px; margin: 20px auto 0; border-radius: 2px; background: var(--mark); }
</style>
